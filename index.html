<div class="rfq-container dark-theme">
  <!-- Header -->
  <div class="rfq-header">
    <div class="rfq-title-group">
      <span class="rfq-icon">🚀</span>
      <h2>RFQ Email Generator</h2>
    </div>
    <p class="rfq-subtitle">Quickly assemble and copy standardized RFQ requests for suppliers.</p>
  </div>

  <div class="rfq-grid">
    <!-- Form Inputs Panel -->
    <div class="rfq-form">
      <div class="form-group">
        <label for="rfqSupplierSelect">Select Supplier</label>
        <select id="rfqSupplierSelect" class="form-control">
          <option value="" disabled selected>-- Select Supplier --</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="rfqAcNumber">AC Number</label>
          <input type="text" id="rfqAcNumber" class="form-control" placeholder="e.g. AC2902" />
        </div>
        <div class="form-group half-width">
          <label for="rfqProjectName">Project Name</label>
          <input type="text" id="rfqProjectName" class="form-control" placeholder="e.g. SHANTA NEW" />
        </div>
      </div>

      <div class="form-group">
        <label for="rfqItemsList">Items Required (List)</label>
        <textarea id="rfqItemsList" class="form-control" rows="5" placeholder="• 1x SS304 Welded Mesh 50x50x3mm (2000x1000mm)&#10;• 5x Profile Base Flanges as per DWG"></textarea>
      </div>
    </div>

    <!-- Live Preview Panel -->
    <div class="rfq-preview-card">
      <div class="preview-header">
        <span class="preview-badge">GENERATED EMAIL OUTPUT</span>
        <span class="preview-tag">Live Preview</span>
      </div>

      <div class="preview-content">
        <div class="preview-subject">
          <strong>SUBJECT:</strong> <span id="outSubject">AC2902 - SHANTA NEW - QUOTE</span>
        </div>
        <div class="preview-body" id="outBody">
          <!-- Dynamically generated text -->
        </div>
      </div>

      <div class="preview-actions">
        <button id="btnCopyRfq" class="btn btn-secondary">
          <span class="btn-icon">📋</span> Copy Text
        </button>
        <button id="btnOpenMailApp" class="btn btn-primary">
          <span class="btn-icon">✉️</span> Open in Email App
        </button>
      </div>
    </div>
  </div>
</div>
